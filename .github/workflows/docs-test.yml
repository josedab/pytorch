name: Test Documentation Examples

# Test all code examples in documentation to ensure they remain valid
# Based on RFC-0004: Interactive Documentation with Live Examples

on:
  push:
    branches:
      - main
      - master
      - release/*
    paths:
      - 'docs/**'
      - 'tools/interactive_docs/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/interactive_docs/**'
  schedule:
    # Run nightly to catch documentation drift
    - cron: '0 2 * * *'

jobs:
  test-examples:
    name: Test Documentation Examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install numpy matplotlib scipy

      - name: Test documentation examples
        run: |
          python tools/interactive_docs/core/example_tester.py \
            --doc-root docs/source \
            --pattern '**/*.rst' \
            --fail-on-error

      - name: Generate test report
        if: always()
        run: |
          python tools/interactive_docs/core/example_tester.py \
            --doc-root docs/source \
            --pattern '**/*.rst' \
            --json > docs_test_report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: docs-test-report-py${{ matrix.python-version }}
          path: docs_test_report.json

  coverage-analysis:
    name: API Coverage Analysis
    runs-on: ubuntu-latest
    needs: test-examples

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Run coverage analysis
        run: |
          python tools/interactive_docs/core/coverage_analyzer.py \
            --module torch \
            --doc-root docs/source \
            --json > coverage_report.json

      - name: Display coverage summary
        run: |
          python tools/interactive_docs/core/coverage_analyzer.py \
            --module torch \
            --doc-root docs/source

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: api-coverage-report
          path: coverage_report.json

      - name: Comment on PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('coverage_report.json', 'utf8'));

            const total = report.total_apis;
            const documented = report.documented;
            const percentage = ((documented / total) * 100).toFixed(1);

            const comment = `## 📊 API Documentation Coverage Report

            **Overall Coverage:** ${percentage}% (${documented} / ${total} APIs)

            ### By Module
            ${Object.entries(report.by_module)
              .sort((a, b) => b[1].doc_percentage - a[1].doc_percentage)
              .slice(0, 10)
              .map(([module, stats]) =>
                `- **${module}**: ${stats.doc_percentage.toFixed(1)}% (${stats.documented} / ${stats.total})`
              )
              .join('\n')}

            ---
            *This report was automatically generated by the documentation coverage analyzer.*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  build-search-index:
    name: Build Search Index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Build search index
        run: |
          python tools/interactive_docs/core/semantic_search.py build \
            --doc-root docs/source \
            --output search_index.json

      - name: Upload search index
        uses: actions/upload-artifact@v3
        with:
          name: search-index
          path: search_index.json
